<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Agent Benchmarks</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script>window.PAPER_BASE = "./";</script>
  </head>
  <body>
    <header class="masthead masthead--simple">
      <div class="masthead__brand">
        <a class="wordmark" href="./">
          <span>
            <span class="wordmark__kicker">arXiv daily</span>
            <span class="wordmark__title">Agent Benchmarks</span>
          </span>
        </a>
      </div>
      <div class="masthead__tools">
        <a
          class="github"
          href="https://github.com/XBsleepy/daily-agent-benchmarks"
          target="_blank"
          rel="noopener"
          aria-label="Open the GitHub repository"
        >
          GitHub
        </a>
      </div>
    </header>
    <main id="main" class="paper-page"></main>
    <footer class="colophon">
      <p class="colophon__meta">
        <span>
          <span data-i18n="visitorsPage">Page views</span>
          <strong id="vercount_value_page_pv">-</strong>
          ·
          <strong id="vercount_value_site_uv">-</strong>
          <span data-i18n="visitorsSite">visitors</span>
        </span>
      </p>
    </footer>
    <script defer src="https://events.vercount.one/js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/bm25.js"></script>
    <script src="./js/paper.js"></script>
  </body>
</html>
