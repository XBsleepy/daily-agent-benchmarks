name: Daily arXiv update

on:
  schedule:
    # arXiv announces new papers Sun–Thu at 20:00 US Eastern.
    # EDT → 00:00 UTC; EST → 01:00 UTC. The API often lags a few minutes.
    # GitHub often delays or skips cron on quiet repos, so keep later catch-ups.
    # Cron days 1–5 (Mon–Fri UTC) = the night of Sun–Thu ET announcements.
    - cron: "25 0 * * 1-5"
    - cron: "25 1 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch and classify new agent benchmarks
        run: |
          for i in 1 2 3; do
            if python scripts/update.py --days 4; then
              exit 0
            fi
            echo "update failed (attempt $i/3)"
            if [ "$i" -lt 3 ]; then
              sleep $((i * 45))
            fi
          done
          exit 1

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/p
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily agent benchmark index"
            git pull --rebase --autostash origin main
            git push
          fi
