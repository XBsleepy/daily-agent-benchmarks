name: Daily arXiv update

on:
  schedule:
    # arXiv announces new papers Sun–Thu at 20:00 US Eastern.
    # Keep fewer slots so GitHub-hosted runners don't stampede export.arxiv.org.
    # Cron days 1–5 (Mon–Fri UTC) = the night of Sun–Thu ET announcements.
    - cron: "40 0 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: daily-arxiv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch and classify new agent benchmarks
        run: |
          # Brief pause so we don't pile onto export.arxiv.org right after another job.
          sleep 20
          for i in 1 2; do
            if python scripts/update.py --days 4; then
              exit 0
            fi
            echo "update failed (attempt $i/2)"
            if [ "$i" -lt 2 ]; then
              sleep 300
            fi
          done
          exit 1

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/p
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily agent benchmark index"
            git pull --rebase --autostash origin main
            git push
          fi
